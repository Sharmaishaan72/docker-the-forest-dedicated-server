services:
  the-forest-dedicated-server:
    container_name: the-forest-dedicated-server
    image: the-forest-dedicated-server:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - 8766:8766/udp
      - 27015:27015/udp
      - 27016:27016/udp
    env_file:
      - ./default.env
    volumes:
      - ./game:/theforest
